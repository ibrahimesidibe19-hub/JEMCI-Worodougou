<div class="wrap"><div class="card"><h2>Tableau de bord</h2><div class="grid">
<div class="stat">💰 Encaissements<div class="big" id="ins">0 FCFA</div></div>

<script>
let data=JSON.parse(localStorage.getItem('jemci_data')||'[]'),current='';
const money=n=>Number(n).toLocaleString('fr-FR')+' FCFA';
function login(){let u=user.value,c=code.value;if((u==='Ibrahim Sidibe'&&c==='1234')||(u==='Moussa Sidibé'&&c==='5678')){current=u;loginBox=document.getElementById('login');loginBox.classList.add('hidden');document.getElementById('app').classList.remove('hidden');who.textContent='Connecté : '+u+(u==='Ibrahim Sidibe'?' — Administrateur':' — Responsable');render()}else alert('Code incorrect.')}
function add(){let m=motif.value.trim(),a=Number(amount.value),t=type.value;if(!m||!a)return alert('Remplissez le motif et le montant.');data.unshift({date:new Date().toLocaleDateString('fr-FR'),type:t,motif:m,amount:a});localStorage.setItem('jemci_data',JSON.stringify(data));motif.value='';amount.value='';render()}
function render(){let i=0,o=0,s='';data.forEach(x=>{x.type==='in'?i+=x.amount:o+=x.amount;s+=`<tr><td>${x.date}</td><td>${x.type==='in'?'Entrée':'Sortie'}</td><td>${x.motif}</td><td>${money(x.amount)}</td></tr>`});ins.textContent=money(i);outs.textContent=money(o);solde.textContent=money(i-o);rows.innerHTML=s}
function receipt(){let n=Number(localStorage.getItem('jemci_receipt')||0)+1;localStorage.setItem('jemci_receipt',n);alert('Reçu JEMCI N° '+String(n).padStart(4,'0')+' créé.')}
function report(){let i=0,o=0;data.forEach(x=>x.type==='in'?i+=x.amount:o+=x.amount);alert('RAPPORT JEMCI WORODOUGOU\n\nEntrées : '+money(i)+'\nSorties : '+money(o)+'\nSolde : '+money(i-o))}
